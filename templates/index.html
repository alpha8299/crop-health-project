<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Health Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        body{
            background:#f4f7f6;
            font-family:Arial, sans-serif;
        }

        /* Navbar */
        .navbar{
            background:#2E7D32;
            padding:15px;
        }

        .navbar-brand{
            color:white !important;
            font-size:30px;
            font-weight:bold;
        }

        .nav-link{
            color:white !important;
            margin-left:20px;
            font-size:18px;
        }

        .nav-link:hover{
            color:#C8E6C9 !important;
        }

        /* Main Card */
        .main-card{
            background:white;
            border-radius:20px;
            padding:40px;
            margin-top:50px;
            box-shadow:0px 5px 25px rgba(0,0,0,0.1);
        }

        /* Upload Box */
        .upload-box{
            border:3px dashed #2E7D32;
            padding:40px;
            border-radius:20px;
            background:#f9fff9;
        }

        .upload-icon{
            font-size:70px;
            color:#2E7D32;
            margin-bottom:20px;
        }

        /* Buttons */
        .btn-custom{
            background:#2E7D32;
            color:white;
            font-size:18px;
            padding:10px;
            border:none;
        }

        .btn-custom:hover{
            background:#1B5E20;
            color:white;
        }

        /* Result Box */
        .result-box{
            margin-top:30px;
            padding:20px;
            border-radius:15px;
            background:#E8F5E9;
            text-align:center;
        }

        .result-box h3{
            color:#1B5E20;
            font-weight:bold;
        }

    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/">
            🌿 Crop Health Prediction
        </a>

        <div>

            <!-- History -->
            <a href="/history" class="nav-link d-inline">
                <i class="fa fa-history"></i> History
            </a>

            <!-- Profile -->
            <a href="/profile" class="nav-link d-inline">
                <i class="fa fa-user"></i> Profile
            </a>

            <!-- Logout -->
            <a href="/logout" class="nav-link d-inline">
                <i class="fa fa-sign-out-alt"></i> Logout
            </a>

        </div>

    </div>

</nav>

<!-- Main Section -->
<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="main-card">

                <!-- Title -->
                <h1 class="text-center mb-4">

                    <i class="fa fa-leaf text-success"></i>

                    Upload Leaf Image

                </h1>

                <!-- Upload Form -->
                <form method="POST" enctype="multipart/form-data">

                    <div class="upload-box text-center">

                        <!-- Camera Icon -->
                        <i class="fa fa-camera upload-icon"></i>

                        <!-- File Upload -->
                        <input type="file"
                               name="file"
                               class="form-control mb-4"
                               required>

                        <!-- Predict Button -->
                        <button type="submit"
                                class="btn btn-custom w-100">

                            <i class="fa fa-search"></i>

                            Predict Disease

                        </button>

                    </div>

                </form>

                <!-- Result Section -->
                {% if result %}

                <div class="result-box">

                    <h4>
                        Prediction Result
                    </h4>

                    <h3>
                        {{ result }}
                    </h3>

                </div>

                {% endif %}

            </div>

        </div>

    </div>

</div>

</body>
</html>
