<!DOCTYPE html>
<html>
<head>

    <title>Prediction History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7f6;
            font-family:Arial;
        }

        .container{
            margin-top:50px;
        }

        .card{
            border-radius:15px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card p-4">

        <h2 class="text-success mb-4">
            🌿 Prediction History
        </h2>

        <table class="table table-bordered table-striped">

            <tr>
                <th>Image</th>
                <th>Prediction</th>
            </tr>

            {% for row in data %}

            <tr>

                <td>
                    {{ row[0] }}
                </td>

                <td>
                    {{ row[1] }}
                </td>

            </tr>

            {% endfor %}

        </table>

        <a href="/"
           class="btn btn-success">

           Back to Home

        </a>

    </div>

</div>

</body>
</html>
